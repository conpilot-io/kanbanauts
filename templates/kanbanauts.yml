# No org Project found automatically. Create a Project and set `project`.
# Generated by the Kanbanauts GitHub App. Phases default to kanbanauts.yml.
version: 1
project: https://github.com/orgs/YOUR_ORG/projects/1
status_field: Status
command_prefix: /agent
mode: opt_out
skip_label: agent:skip
columns:
  Plan:
    on_enter: [{ run: plan }]
    on_leave: [{ cancel: true }]
    on_no_code: { move_to: Done }
  DoIt:
    on_enter: [{ run: doit }]
    on_leave: [{ cancel: true }]
    on_success: { move_to: Review }
  Review:
    on_enter: [{ run: review }]
    on_leave: [{ cancel: true }]
    on_pr_approved: { move_to: Tests }
  Tests:
    on_enter: []
  Done: {}
