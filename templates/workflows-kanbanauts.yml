# kanbanauts-caller: 4
# Managed by the Kanbanauts GitHub App. Do not edit by hand unless
# you know you need a newer caller version. Agent logic lives in
# conpilot-io/kanbanauts @v1 and updates when that tag moves.
name: Kanbanauts
run-name: "agent ${{ inputs.phase }} #${{ inputs.issue_number }}"
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number
        required: true
        type: number
      phase:
        description: Phase name (plan or doit)
        required: true
        type: string
concurrency:
  group: kanbanauts-${{ inputs.issue_number }}
  cancel-in-progress: false
permissions:
  actions: read
  checks: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  plan_claude:
    if: >-
      inputs.phase == 'plan' && (vars.KANBANAUTS_ENGINE || 'claude') == 'claude'
    uses: conpilot-io/kanbanauts/.github/workflows/agent-plan-claude.lock.yml@v1
    with:
      issue_number: ${{ inputs.issue_number }}
    secrets:
      KANBANAUTS_AI_API_KEY: ${{ secrets.KANBANAUTS_AI_API_KEY }}

  plan_codex:
    if: >-
      inputs.phase == 'plan' && vars.KANBANAUTS_ENGINE == 'codex'
    uses: conpilot-io/kanbanauts/.github/workflows/agent-plan-codex.lock.yml@v1
    with:
      issue_number: ${{ inputs.issue_number }}
    secrets:
      KANBANAUTS_AI_API_KEY: ${{ secrets.KANBANAUTS_AI_API_KEY }}

  plan_gemini:
    if: >-
      inputs.phase == 'plan' && vars.KANBANAUTS_ENGINE == 'gemini'
    uses: conpilot-io/kanbanauts/.github/workflows/agent-plan-gemini.lock.yml@v1
    with:
      issue_number: ${{ inputs.issue_number }}
    secrets:
      KANBANAUTS_AI_API_KEY: ${{ secrets.KANBANAUTS_AI_API_KEY }}

  doit_claude:
    if: >-
      inputs.phase == 'doit' && (vars.KANBANAUTS_ENGINE || 'claude') == 'claude'
    uses: conpilot-io/kanbanauts/.github/workflows/agent-doit-claude.lock.yml@v1
    with:
      issue_number: ${{ inputs.issue_number }}
    secrets:
      KANBANAUTS_AI_API_KEY: ${{ secrets.KANBANAUTS_AI_API_KEY }}

  doit_codex:
    if: >-
      inputs.phase == 'doit' && vars.KANBANAUTS_ENGINE == 'codex'
    uses: conpilot-io/kanbanauts/.github/workflows/agent-doit-codex.lock.yml@v1
    with:
      issue_number: ${{ inputs.issue_number }}
    secrets:
      KANBANAUTS_AI_API_KEY: ${{ secrets.KANBANAUTS_AI_API_KEY }}

  doit_gemini:
    if: >-
      inputs.phase == 'doit' && vars.KANBANAUTS_ENGINE == 'gemini'
    uses: conpilot-io/kanbanauts/.github/workflows/agent-doit-gemini.lock.yml@v1
    with:
      issue_number: ${{ inputs.issue_number }}
    secrets:
      KANBANAUTS_AI_API_KEY: ${{ secrets.KANBANAUTS_AI_API_KEY }}
