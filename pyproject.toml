[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kanbanauts"
version = "0.1.0"
description = "Kanbanauts — GitHub Projects + AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "PyJWT[crypto]>=2.9",
  "cryptography>=43",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "PyYAML>=6.0",
  "starlette>=0.38",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
azure = [
  "azure-functions>=1.21",
  "azure-identity>=1.17",
  "azure-keyvault-secrets>=4.8",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "mypy-baseline>=0.7",
  "types-PyYAML>=6.0",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["kanbanauts"]
mypy_path = "backend"
warn_unused_ignores = true
